<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Travel Agent - AI-powered travel assistant">
    <title>🧳 Travel Agent</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Top Header -->
    <header class="top-header">
        <div class="header-left">
            <span class="logo-icon">🧳</span>
            <h1 class="app-title">Travel Agent</h1>
        </div>
        <div class="header-right">
            <button class="header-btn" id="clearChatBtn" onclick="clearChat()">
                <span class="btn-icon">🗑️</span>
                <span class="btn-text">Clear Chat</span>
            </button>
            <button class="header-btn" id="exportBtn" onclick="exportChat()">
                <span class="btn-icon">💾</span>
                <span class="btn-text">Export</span>
            </button>
        </div>
    </header>

    <!-- Chat Messages Area -->
    <main class="chat-container">
        <div class="messages-wrapper" id="messagesWrapper">

            <!-- Welcome message (показывается только когда нет сообщений) -->
            <div class="welcome-message" id="welcomeMessage">
                <h2>👋 Привет! Я ваш помощник по путешествиям</h2>
                <p>Я помогу вам спланировать поездку, узнать погоду и найти рейсы.</p>

                <div class="example-prompts">
                    <h3>Примеры запросов:</h3>
                    <button class="example-prompt" data-prompt="Какая погода в Париже?" onclick="useExamplePrompt(this)">
                        🌤️ Какая погода в Париже?
                    </button>
                    <button class="example-prompt" data-prompt="Найди рейсы из Амстердама в Лондон" onclick="useExamplePrompt(this)">
                        ✈️ Найди рейсы из Амстердама в Лондон
                    </button>
                    <button class="example-prompt" data-prompt="Спланируй поездку в Берлин на выходные" onclick="useExamplePrompt(this)">
                        🗺️ Спланируй поездку в Берлин на выходные
                    </button>
                </div>
            </div>

            <!-- Сообщения появляются здесь динамически -->

        </div>
    </main>

    <!-- Input Bar (Sticky Bottom) -->
    <div class="input-bar">
        <div class="input-wrapper">
            <textarea
                id="userInput"
                class="input-field"
                placeholder="Message Travel Agent..."
                rows="1"
                oninput="handleInputChange()"
                onkeydown="handleKeyDown(event)"
            ></textarea>
            <button id="sendBtn" class="send-button" disabled onclick="sendMessage()">
                <span class="send-icon">→</span>
            </button>
        </div>
    </div>

    <!-- Include JavaScript -->
    <script src="/static/app.js"></script>
</body>
</html>
